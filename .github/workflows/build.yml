name: Build desktop apps

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "docs/**", "cloud/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows (x64)
            os: windows-latest
            args: ""
            rust-targets: ""
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p ../dist && [ -f ../dist/index.html ] || echo '<html></html>' > ../dist/index.html
          cargo test

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: build-${{ github.run_number }}
          releaseName: NEXUS v__VERSION__ (build ${{ github.run_number }})
          releaseBody: |
            Unsigned development build from commit ${{ github.sha }}.

            **macOS:** download the `.dmg`, drag NEXUS to Applications, then run
            `xattr -cr /Applications/NEXUS.app` once in Terminal before opening it
            (the app is not notarised yet, so macOS blocks it otherwise).
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: true

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: warn
